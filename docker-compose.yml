services:
  api:
    build: .
    command: python main.py
    ports: ["8080:8080"]
    environment: &env
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      LEGACY_DB_URL: mysql://app:app@mysql:3306/legacy
      MONGODB_URI: mongodb://mongodb:27017/app
      REDIS_URL: redis://redis:6379/0
      AMQP_URL: amqp://app:app@rabbitmq:5672/
    depends_on: [postgres, mysql, mongodb, redis, rabbitmq]
  worker:
    build: .
    command: python -m app.worker
    environment: *env
    depends_on: [postgres, mysql, mongodb, rabbitmq]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
  mysql:
    image: mysql:8
    environment: {MYSQL_ROOT_PASSWORD: app, MYSQL_DATABASE: legacy, MYSQL_USER: app, MYSQL_PASSWORD: app}
  mongodb:
    image: mongo:7
  redis:
    image: redis:7-alpine
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: app, RABBITMQ_DEFAULT_PASS: app}
